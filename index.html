<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body onload="addTabIndex()">

    <h1>Interactive Photo Gallery</h1>
    
    <div id="image-container">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img class="preview" alt="Beautiful landscape with mountains" src="pic1.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="A quiet beach during sunset" src="pic2.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="City skyline at night" src="pic3.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="Macro shot of a blooming flower" src="pic4.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="A cute puppy playing in the grass" src="pic5.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="Delicious slice of chocolate cake" src="pic6.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>

</body>
</html>

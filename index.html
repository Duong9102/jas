<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body onload="addTabIndex()">

    <h1>Interactive Photo Gallery</h1>
    
    <div id="image-container">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img class="preview" alt="Beautiful landscape with mountains" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTw4PYeJcMVDF11lISVPRtfZFIwN0Sc30KJkOCPek42iA&s=10" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="A quiet beach during sunset" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTm01QTL2mpgNAvnNDz6Dq9maFR42_3YKMNQIMR2NPnwg&s=10" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="City skyline at night" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSocN2RGrPUPddMgQTOaTXHUqeUvw162d2KTzb428ZZFw&s=10" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="Macro shot of a blooming flower" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLDThBTCZki1nNSi_bnzr4CWoaXM3W2j0E3voGCmkD3g&s=10" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="A cute puppy playing in the grass" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXXMNYgg5OjFCvycjEoPIfIJ-HyBo0_cK2_pluT9QYHA&s=10" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
             
        <img class="preview" alt="Delicious slice of chocolate cake" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQj0gZtZm-Ahz8jDp7tIzfLKtxiBdTyRgfFcFuG6l7v_Q&s=10" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>

</body>
</html>
